name: Deploy

on:
  push:
    branches: [main]

# Required repo secret: FLY_API_TOKEN (from `fly tokens create deploy`).
jobs:
  deploy:
    name: Deploy to Fly
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false
    needs: []
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --config infra/fly.toml --dockerfile Dockerfile
